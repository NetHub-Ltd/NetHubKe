name: Backend CI (pytest)

on:
  push:
    branches: [dev, master, main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [dev]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: apps/backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nethub_ci
          POSTGRES_PASSWORD: nethub_ci
          POSTGRES_DB: nethub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nethub_ci -d nethub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_NAME: NetHubKe
      APP_VERSION: 0.1.0
      IMAGE_TAG: ci
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:3000
      FASTAPI_DB_USER: nethub_ci
      FASTAPI_DB_PASSWORD: nethub_ci
      FASTAPI_DB_HOST: localhost
      FASTAPI_DB_PORT: "5432"
      FASTAPI_DB_NAME: nethub_ci
      OIDC_ISSUER: https://idp.test/realms/nethub
      OIDC_JWKS_URL: https://idp.test/realms/nethub/protocol/openid-connect/certs
      AUDIENCE: nethub-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -q
