name: Backend CI (pytest + coverage)

on:
  push:
    branches: [dev, master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [dev]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: apps/backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Ephemeral CI DB only. trust = no password (GitGuardian-safe; not for production).
          POSTGRES_USER: nethub_ci
          POSTGRES_DB: nethub_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nethub_ci -d nethub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_NAME: NetHubKe-Test
      APP_VERSION: 0.0.0
      IMAGE_TAG: test
      STARTUP_TEST: "false"
      ENVIRONMENT: development
      FASTAPI_DB_USER: nethub_ci
      # Empty password + trust auth on the service container
      FASTAPI_DB_PASSWORD: ""
      FASTAPI_DB_NAME: nethub_ci
      FASTAPI_DB_HOST: localhost
      FASTAPI_DB_PORT: "5432"
      KEYCLOAK_ISSUER_URL: https://idp.test/realms/nethub
      KEYCLOAK_JWKS: https://idp.test/realms/nethub/protocol/openid-connect/certs
      AUDIENCE: nethub-backend
      ALLOWED_ORIGINS: http://localhost:3000
      REDIS_URL: redis://localhost:6379/0
      TAWALA_EXCHANGE_ENABLED: "false"
      TAWALA_JWT_ISSUER: http://localhost:8000
      TAWALA_JWT_AUDIENCE: tawala-api
      JWKS_REDIS_TTL_SEC: "60"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Per-file coverage (no zero-coverage modules)
        run: python scripts/check_coverage_files.py

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
