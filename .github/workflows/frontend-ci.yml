name: Frontend CI

on:
  push:
    branches:
      - dev
      - master
      - main
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - dev
      - master
      - main
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/frontend

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install

      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install

      - name: Build
        env:
          NODE_ENV: production
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-build-placeholder-not-a-real-secret
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          OIDC_ISSUER: https://example.com
          OIDC_CLIENT_ID: ci-client
          OIDC_CLIENT_SECRET: ci-secret
          KEYCLOAK_CLIENT_ID: ci-client
          KEYCLOAK_CLIENT_SECRET: ci-secret
          KEYCLOAK_ISSUER: https://example.com
          BACKEND_URL: http://127.0.0.1:8000/api/v1
        run: npm run build
