name: Frontend CI

on:
  push:
    branches: [dev, master, main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [dev, master]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/frontend

jobs:
  lint-and-build:
    name: Lint + Next.js build
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-build-secret-not-for-production-use-32chars
      AUTH_URL: http://localhost:3000
      AUTH_OIDC_ISSUER: https://idp.test/realms/nethub
      AUTH_OIDC_CLIENT_ID: ci-client
      AUTH_OIDC_CLIENT_SECRET: ci-secret
      NETHUB_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies and regenerate lockfile
        run: npm install --no-audit --no-fund --fetch-retries=1 --fetch-timeout=60000
      - name: Commit generated lockfile to the pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = "apps/frontend/package-lock.json";
            const branch = context.payload.pull_request.head.ref;
            const generatedContent = fs.readFileSync(path, "utf8");
            const content = Buffer.from(generatedContent, "utf8").toString("base64");
            const { data: current } = await github.rest.repos.getContent({
              ...context.repo,
              path,
              ref: branch,
            });
            const currentContent = Buffer.from(current.content, "base64").toString("utf8");
            if (currentContent === generatedContent) {
              core.info("The frontend lockfile is already up to date.");
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              branch,
              message: "chore(frontend): regenerate Next.js 16 lockfile",
              content,
              sha: current.sha,
            });
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
