name: Frontend CI

on:
  push:
    branches: [dev, master, main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [dev]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: apps/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-build-secret-not-for-production-use-32chars
      AUTH_URL: http://localhost:3000
      AUTH_OIDC_ISSUER: https://idp.test/realms/nethub
      AUTH_OIDC_CLIENT_ID: ci-client
      AUTH_OIDC_CLIENT_SECRET: ci-secret
      NETHUB_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
